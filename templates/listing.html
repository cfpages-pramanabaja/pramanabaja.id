<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artikel Dikelola Admin – PRAMANA Baja</title>
  <meta name="description" content="Daftar artikel yang dikelola melalui admin Pramana Baja.">
  <link rel="canonical" href="/artikel/managed/">
  <link rel="stylesheet" href="/wp-content/themes/astra/assets/css/minified/main.min.css?ver=4.12.4">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Karla:400|Rubik:700,500&display=fallback">
  <style>
    body { background: #fef1e4; color: #353535; font-family: Karla, sans-serif; margin: 0; }
    .pb-shell { max-width: 1100px; margin: 0 auto; padding: 48px 20px 72px; }
    .pb-brand { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .pb-brand img { width: 64px; height: 64px; }
    .pb-brand a { color: #1c0d0a; text-decoration: none; font-family: Rubik, sans-serif; font-weight: 700; }
    .pb-header h1 { font-family: Rubik, sans-serif; color: #1c0d0a; margin: 0 0 8px; }
    .pb-header p { margin: 0 0 28px; color: #666; }
    .managed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 767px) { .managed-grid { grid-template-columns: 1fr; } }
    .managed-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(28, 13, 10, 0.08); }
    .managed-card__image img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .managed-card__body { padding: 18px; }
    .managed-card__meta { color: #ff6210; font-size: 0.85rem; margin: 0 0 8px; }
    .managed-card h2 { font-family: Rubik, sans-serif; font-size: 1.1rem; margin: 0 0 10px; line-height: 1.4; }
    .managed-card h2 a { color: #1c0d0a; text-decoration: none; }
    .managed-card p { margin: 0; color: #555; line-height: 1.6; font-size: 0.95rem; }
    .managed-empty { background: #fff; border-radius: 12px; padding: 24px; text-align: center; }
    .pb-back { display: inline-block; margin-bottom: 18px; color: #ff6210; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="pb-shell">
    <header class="pb-brand">
      <a href="/">
        <img src="/wp-content/uploads/2024/08/Logo-Pramana-Baja-80x80.png" alt="PRAMANA Baja">
      </a>
      <a href="/">PRAMANA Baja</a>
    </header>

    <a class="pb-back" href="/artikel/">← Kembali ke halaman artikel</a>

    <div class="pb-header">
      <h1>Artikel Dikelola Admin</h1>
      <p>{{articleCount}} artikel · diperbarui {{generatedAt}}</p>
    </div>

    <div class="managed-grid">
      {{articleCards}}
    </div>
  </div>
</body>
</html>
